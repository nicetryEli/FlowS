<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TDTU · Scheduled — UI Prototype (throwaway)</title>
<style>
  :root {
    --bg: #e9ebed;
    --cell: #ffffff;
    --cell-out: #e2e5e9;
    --line: #e2e5e9;
    --line-strong: #d3d8de;
    --text: #111111;
    --muted: #6b7280;
    --muted-2: #9aa1ab;
    --gold: #d9a92e;
    --radius: 6px;
    --pill: 6px;
    font-synthesis: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ── Top navigation bar ─────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 0 14px;
  }
  .tabs { display: flex; gap: 2px; align-items: center; }
  .tabs a {
    color: #4b5563; text-decoration: none; font-size: 13px; font-weight: 550;
    padding: 9px 13px; border-radius: var(--radius); transition: .15s;
  }
  .tabs a:hover { background: #dfe3e8; }
  .tabs a.active { background: #dfe3e8; color: #111827; font-weight: 650; }
  .top-spacer { flex: 1; }

  .view-switch { display: flex; gap: 8px; align-items: center; }
  .view-switch button {
    border: 1px solid var(--line-strong); background: #f4f5f6;
    color: #4b5563; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer; transition: .15s;
  }
  .view-switch button:hover { background: #eceff3; }
  .view-switch button.active { background: #fffdf2; border: 1.5px solid var(--gold); color: #8a6d1a; }

  /* Month selector: plain bordered box + ‹ › */
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav .navbtn {
    width: 30px; height: 32px; border: 1px solid var(--line-strong);
    background: #f4f5f6; color: #4b5563; font-size: 14px;
    border-radius: var(--radius); cursor: pointer;
  }
  .month-nav .navbtn:hover { background: #eceff3; color: #111; }
  .month-picker {
    display: flex; align-items: center; gap: 8px;
    background: #f4f5f6; border: 1px solid var(--line-strong);
    color: #111827; border-radius: var(--radius);
    padding: 8px 10px; font-size: 12px; font-weight: 650;
    cursor: pointer; min-width: 132px; justify-content: space-between; font-family: inherit;
  }
  .month-picker .chev { color: var(--muted); font-size: 10px; }
  .today-jump {
    border: 0; background: transparent; color: var(--muted);
    font-size: 9.5px; font-weight: 800; letter-spacing: .12em;
    padding: 8px 2px; cursor: pointer; white-space: nowrap;
  }
  .today-jump:hover { color: #c47b17; }

  /* Sub-header strip: weekday labels LEFT-aligned per column */
  .subbar { display: flex; align-items: center; padding: 14px 18px 6px; }
  .weekday-strip { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .weekday-strip span {
    text-align: left; padding-left: 10px;
    font-size: 9.5px; letter-spacing: .16em; font-weight: 700; color: #a8aeb7;
  }

  /* ── Calendar grid ──────────────────────────────────────── */
  .calendar {
    flex: 1; min-height: 0; padding: 4px 18px 18px;
    display: grid; gap: 10px;
    grid-template-rows: repeat(5, 1fr);
  }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; position: relative; min-height: 0; }

  .day {
    background: var(--cell);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px 8px;
    min-height: 0;
    display: flex; flex-direction: column; gap: 5px;
    position: relative; overflow: hidden;
  }
  .day.out { background: var(--cell-out); border-color: transparent; }
  .day.out .num { color: #b4bac2; }

  .day-head { display: flex; align-items: baseline; justify-content: space-between; }
  .day .num { font-size: 20px; font-weight: 500; color: #111111; line-height: 1; }
  /* Today: orange label left, number right; cell stays white with a light outline */
  .day.today { outline: 1.5px solid #f2cf8a; outline-offset: -1px; }
  .today-label { color: #e0a32e; font-size: 14px; font-weight: 700; }
  /* Blue "Active!" day-level label (mockup spec) */
  .active-tag { color: #2f6bff; font-size: 12px; font-weight: 650; }

  /* Event chips — full-width pastel bars */
  .ev {
    display: flex; align-items: center; gap: 10px;
    font-size: 10px; border: 0; border-radius: 4px; padding: 4px 8px;
    white-space: nowrap; overflow: hidden;
    cursor: pointer; text-align: left; width: 100%; font-family: inherit;
  }
  .ev .t { font-weight: 800; font-size: 9.5px; flex: none; opacity: .8; font-variant-numeric: tabular-nums; }
  .ev .d { font-weight: 550; flex: 1; text-align: center; opacity: .9; overflow: hidden; text-overflow: ellipsis; }
  .ev:hover { filter: brightness(.97); }

  .tag-green  { background: #d9f2df; color: #2c6e44; }
  .tag-blue   { background: #dde9fd; color: #2c5cb8; }
  .tag-yellow { background: #fbf3cf; color: #8a6d1a; }
  .tag-pink   { background: #fde3ee; color: #a63d63; }
  .tag-orange { background: #ffedd0; color: #8a6d1a; }
  .tag-grey   { background: #eceff2; color: #6b7280; }
  .tag-coral  { background: #fee2e2; color: #b91c1c; }
  .tag-purple { background: #ede9fe; color: #6d28d9; }

  .ev.deadline { background: #fde3ee; color: #a63d63; outline: 1px dashed #eda3c0; outline-offset: -1px; }

  .more { font-size: 9.5px; color: var(--muted); padding-left: 8px; font-weight: 600; }

  /* Multi-day span banners — flat pastel with dark text */
  .span-banner {
    position: absolute; top: calc(100% - 32px); height: 22px;
    border-radius: 4px;
    display: flex; align-items: center; padding: 0 12px;
    font-size: 11px; font-weight: 600; color: #2c6e44;
    white-space: nowrap; overflow: hidden; cursor: pointer;
    z-index: 2;
  }
  .span-banner .t { font-weight: 800; margin-right: 18px; font-size: 9.5px; opacity: .75; font-variant-numeric: tabular-nums; }
  .span-banner .d { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .banner-green { background: #d9f2df; }
  .banner-pink  { background: #fbd9e4; color: #a63d63; }
  .span-banner.edge-l { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
  .span-banner.edge-r { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
  .span-pad { padding-bottom: 30px; }
  .span-pad2 { padding-bottom: 54px; }

  /* ── Event detail modal ───────────────────────────────────── */
  .backdrop {
    position: fixed; inset: 0; background: rgba(31, 41, 55, .35);
    backdrop-filter: blur(3px);
    display: grid; place-items: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: min(440px, calc(100vw - 48px));
    background: #ffffff; border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 20px 50px rgba(16,24,40,.18);
    padding: 18px 20px 16px; transform: translateY(8px) scale(.98); transition: transform .18s;
  }
  .backdrop.open .modal { transform: none; }
  .modal .kind {
    display: inline-flex; align-items: center;
    font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 4px;
    background: #dde9fd; color: #2c5cb8; margin-bottom: 10px;
  }
  .modal .kind.exam    { background: #fee2e2; color: #b91c1c; }
  .modal .kind.deadline{ background: #fde3ee; color: #a63d63; }
  .modal .kind.personal{ background: #d9f2df; color: #2c6e44; }
  .modal h3 { font-size: 19px; line-height: 1.3; margin-bottom: 12px; font-weight: 700; color: #111827; }
  .rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; font-size: 12px; align-items: baseline; }
  .row .lbl { width: 76px; flex: none; color: var(--muted-2); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; padding-top: 2px; }
  .row .val { color: var(--text); font-weight: 550; }
  .modal-actions { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .btn {
    border: 1px solid var(--line-strong); background: #f7f8f9; color: var(--text);
    border-radius: var(--radius); font-size: 12px; font-weight: 600;
    padding: 8px 13px; cursor: pointer; transition: .15s; font-family: inherit;
  }
  .btn:hover { background: #eceff3; }
  .btn.primary { background: #111827; border-color: transparent; color: #fff; font-weight: 750; }
  .btn.primary:hover { background: #000; }
  .btn.link { margin-left: auto; text-decoration: none; }
  .btn.close-x { margin-left: auto; border: 0; background: transparent; font-size: 16px; color: var(--muted); padding: 4px 8px; }

  /* Footer strip — like example.png */
  .footer {
    flex: none;
    display: flex; align-items: center; gap: 26px;
    background: #f4f5f6;
    border-top: 1px solid var(--line);
    padding: 10px 18px;
    font-size: 11px; color: #4b5563;
  }
  .footer a { color: #4b5563; text-decoration: none; }
  .footer a:hover { text-decoration: underline; color: #111827; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
</style>
</head>
<body>

<!-- ═══ Main (full-bleed, flat minimal — like example.png) ═══ -->
<main class="main">

  <!-- Top navigation bar -->
  <header class="topbar">
    <nav class="tabs">
      <a href="#">Activity</a>
      <a href="#">Tasks</a>
      <a href="#" class="active">Scheduled</a>
      <a href="#">Analytics</a>
      <a href="#">Documents</a>
    </nav>
    <div class="top-spacer"></div>

    <div class="view-switch" role="tablist">
      <button>WEEK</button>
      <button class="active">MONTH</button>
      <button>YEAR</button>
    </div>

    <div class="month-nav">
      <button class="navbtn" id="prevMonth" aria-label="Previous month">‹</button>
      <button class="month-picker" id="monthPicker">
        <span id="monthLabel">November 2026</span>
        <span class="chev">▾</span>
      </button>
      <button class="navbtn" id="nextMonth" aria-label="Next month">›</button>

  <!-- Weekday strip -->
  <div class="subbar">
    <div class="weekday-strip">
      <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
    </div>
  </div>

  <!-- Month grid (rendered by JS) -->
  <section class="calendar" id="calGrid" aria-label="month calendar"></section>
</main>

<!-- ═══ Event detail modal ═══ -->
<div class="backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div style="display:flex; align-items:flex-start; gap:10px;">
      <span class="kind" id="modalKind">CLASS</span>
      <button class="btn close-x" id="modalClose" aria-label="Close">✕</button>
    </div>
    <h3 id="modalTitle">Event title</h3>
    <div class="rows" id="modalRows"></div>
    <div class="modal-actions">
      <button class="btn" id="modalEdit">✎ Edit</button>
      <button class="btn" id="modalDelete">🗑 Delete</button>
      <a class="btn primary link" id="modalLink" href="#" target="_blank" rel="noopener">Open in eLearning →</a>
    </div>
  </div>
</div>

<!-- ═══ Footer strip (visual parity with example.png; links are placeholders) ═══ -->
<footer class="footer">
  <a href="#">Privacy</a>
  <a href="#">Community</a>
  <a href="#">Help</a>
  <a href="#">Cookie preferences</a>
  <a href="#">Do not sell or share my personal information</a>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────
   Throwaway prototype data layer — mirrors the ERD's unified
   `calendar_events` view (kind, title, location, start, end,
   all_day, tag). Real app: SQLite + FastAPI.
   ───────────────────────────────────────────────────────────── */
const EVENTS = [
  // Classes (status: scheduled | absent | makeup)
  { id:'ev-nm1', kind:'class', title:'Nhập môn Học máy', date:'2026-11-03', start:'07:40', end:'10:10', period:'4–6', location:'B403', status:'absent' },
  { id:'ev-ltw', kind:'class', title:'Thực hành Lập trình web và ứng dụng', date:'2026-11-07', start:'07:40', end:'10:10', period:'4–6', location:'A508', status:'scheduled' },
  { id:'ev-cnpm-mk', kind:'class', title:'Công nghệ phần mềm', date:'2026-11-07', start:'07:40', end:'10:10', period:'4–6', location:'A602', status:'makeup' },
  { id:'ev-cngt', kind:'class', title:'Công nghệ phần mềm', date:'2026-11-05', start:'12:45', end:'15:15', period:'7–9', location:'D0205-B', status:'scheduled', notes:'Chương 7 · báo cáo tiến độ sprint' },
  { id:'ev-pttvd', kind:'class', title:'PT & TVDL (online)', date:'2026-11-06', start:'12:45', end:'15:15', period:'7–9', location:'HOCTRUCTUYEN-5', status:'makeup' },
  { id:'ev-pttvd-th', kind:'class', title:'Thực hành PT & TVDL', date:'2026-11-06', start:'12:45', end:'15:15', period:'7–9', location:'A503', status:'absent' },
  { id:'ev-cnpm-th', kind:'class', title:'Thực hành Công nghệ phần mềm', date:'2026-11-07', start:'14:25', end:'17:05', period:'10–12', location:'A509', status:'absent' },
  { id:'ev-nm2', kind:'class', title:'Nhập môn Học máy', date:'2026-11-10', start:'07:40', end:'10:10', period:'4–6', location:'B403', status:'scheduled' },
  { id:'ev-sinh', kind:'class', title:'Sinh hoạt chủ nhiệm khoa CNTT', date:'2026-11-09', start:'18:05', end:'20:35', period:'13–15', location:'B306-A', status:'scheduled' },
  { id:'ev-cnpm-2', kind:'class', title:'Công nghệ phần mềm', date:'2026-11-12', start:'12:45', end:'15:15', period:'7–9', location:'D0205-B', status:'scheduled' },
  { id:'ev-nm3', kind:'class', title:'Nhập môn Học máy', date:'2026-11-17', start:'07:40', end:'10:10', period:'4–6', location:'B403', status:'scheduled' },
  { id:'ev-cnpm-3', kind:'class', title:'Công nghệ phần mềm', date:'2026-11-19', start:'12:45', end:'15:15', period:'7–9', location:'D0205-B', status:'scheduled' },
  { id:'ev-ltw-mk', kind:'class', title:'Lập trình web và ứng dụng', date:'2026-11-08', start:'07:40', end:'10:10', period:'4–6', location:'HOCTRUCTUYEN-5', status:'makeup' },
  // Exams
  { id:'ev-one7', kind:'personal', title:'One', date:'2026-11-07', start:'10:30', end:'11:00', tag:'tag-green' },
  { id:'ev-two7', kind:'personal', title:'Two', date:'2026-11-07', start:'12:00', end:'12:30', tag:'tag-blue' },
  { id:'ev-exam1', kind:'exam', title:'Giữa kỳ — CNPM', date:'2026-11-26', start:'07:30', end:null, location:'A507', examType:'Giữa kỳ', notes:'Crawled from exam grid' },
  // Deadlines
  { id:'ev-bt3', kind:'deadline', title:'BT3 — Chương 5', date:'2026-11-12', start:'23:59', end:null, course:'Công nghệ phần mềm', url:'https://elearning.tdtu.edu.vn/mod/assign/view.php?id=demo', notes:'Nộp bài trước 23:59' },
  // Personal events (banner = spanning full rows; allDay)
  { id:'ev-vac', kind:'personal', title:'I am on my Vacation. Switched my phone off 📵', timeLabel:'00:00AM', startDate:'2026-11-08', endDate:'2026-11-14', allDay:true, banner:'green' },
  { id:'ev-dubai', kind:'personal', title:'Dubai Business Conference', timeLabel:'10:30AM', startDate:'2026-11-07', endDate:'2026-11-08', allDay:true, banner:'pink' },
  { id:'ev-chal', kind:'personal', title:'Challenge', date:'2026-11-22', start:'10:30', end:'11:20', tag:'tag-yellow' },
  { id:'ev-speak', kind:'personal', title:'Public spea…', date:'2026-11-22', start:'12:00', end:'13:00', tag:'tag-pink' },
  { id:'ev-three22', kind:'personal', title:'Three', date:'2026-11-22', start:'2:30PM', end:'15:00', tag:'tag-blue' },
  { id:'ev-one23', kind:'personal', title:'One', date:'2026-11-23', start:'10:30', end:'11:00', tag:'tag-green' },
  { id:'ev-group', kind:'personal', title:'Group call', date:'2026-11-23', start:'12:00', end:'13:00', tag:'tag-yellow' },
  { id:'ev-conference', kind:'personal', title:'Conference', date:'2026-11-23', start:'2:30PM', end:'16:00', tag:'tag-pink' },
  { id:'ev-fitness', kind:'personal', title:'Fitness', date:'2026-11-23', start:'4:30PM', end:'17:30', tag:'tag-blue' },
  { id:'ev-one10', kind:'personal', title:'One', date:'2026-11-10', start:'10:30', end:'11:00', tag:'tag-yellow' },
  { id:'ev-voice', kind:'personal', title:'Voice Call', date:'2026-11-25', start:'10:30', end:'11:00', tag:'tag-green' },
  { id:'ev-family', kind:'personal', title:'Family time', date:'2026-11-27', start:'10:30', end:'11:30', tag:'tag-grey' },
  { id:'ev-one', kind:'personal', title:'One', date:'2026-11-02', start:'10:30', end:'11:00', tag:'tag-green' },
  { id:'ev-basket', kind:'personal', title:'Office BBQ', date:'2026-11-05', start:'10:30', end:'11:30', tag:'tag-green' },
  { id:'ev-meet', kind:'personal', title:'Meet Tony', date:'2026-11-05', start:'12:00', end:'12:30', tag:'tag-blue' },
  { id:'ev-three', kind:'personal', title:'Three', date:'2026-11-05', start:'2:30PM', end:'15:00', tag:'tag-yellow' },
  { id:'ev-gym', kind:'personal', title:'Gym · legs', date:'2026-11-24', start:'07:40', end:'08:40', tag:'tag-yellow' },
  { id:'ev-demo', kind:'personal', title:'Project demo', date:'2026-12-02', start:'09:30', end:'10:30', tag:'tag-orange' },
  // October 2026 (for month navigation demo)
  { id:'ev-oct-exam', kind:'exam', title:'Giữa kỳ — CNPM (đã thi)', date:'2026-09-30', start:'07:30', end:null, location:'A507', examType:'Giữa kỳ', notes:'Crawled from exam grid' },
  { id:'ev-oct-gym', kind:'personal', title:'Gym · back', date:'2026-10-26', start:'07:00', end:'08:00', tag:'tag-green' },
  // December 2026
  { id:'ev-dec-nm', kind:'class', title:'Nhập môn Học máy', date:'2026-12-01', start:'07:40', end:'10:10', period:'4–6', location:'B403', status:'scheduled' },
  { id:'ev-dec-final', kind:'exam', title:'Cuối kỳ — CNPM', date:'2026-12-15', start:'07:30', end:null, location:'A507', examType:'Cuối kỳ', notes:'Crawled from exam grid' },
];

const EVENT_MAP = Object.fromEntries(EVENTS.map(e => [e.id, e]));
const $ = s => document.querySelector(s);
const grid = $('#calGrid');

/* Current view state — default: November 2026 (demo focus month) */
let viewYear = 2026, viewMonth = 10; // 0-indexed → November
const today = new Date();
const TODAY = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad2 = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ACTIVE_TAGS = { '2026-11-13': 'Active!' };   // mockup's day-level status label

/* Which events touch a given date? */
function eventsOn(y, m, d) {
  const key = iso(y, m, d);
  const day = parseISO(key);
  return EVENTS.filter(ev => {
    if (ev.date) return ev.date === key;
    if (ev.startDate && ev.endDate) {
      return day >= parseISO(ev.startDate) && day <= parseISO(ev.endDate);
    }
    return false;
  });
}
const isSpanning = ev => !!(ev.startDate && ev.endDate);

/* Chip rendering — flat pastel bars */
const chipClass = ev => {
  if (ev.kind === 'class') return ev.status === 'absent' ? 'tag-grey' : ev.status === 'makeup' ? 'tag-yellow' : 'tag-blue';
  if (ev.kind === 'exam') return 'tag-coral';
  if (ev.kind === 'deadline') return 'deadline';
  return ev.tag || 'tag-green';
};
const chipTime = ev => ev.start || '';

/* Render one month into #calGrid */
function render() {
  $('#monthLabel').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const firstDow = new Date(viewYear, viewMonth, 1).getDay();      // 0 = Sunday
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const totalCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  const weeks = totalCells / 7;

  grid.style.gridTemplateRows = `repeat(${weeks}, 1fr)`;
  grid.innerHTML = '';

  for (let w = 0; w < weeks; w++) {
    const row = document.createElement('div');
    row.className = 'week';

    /* Pre-compute banner overlap for this row (for stacking + padding) */
    const rowStart = w * 7 - firstDow + 1;
    const rowStartDate = new Date(viewYear, viewMonth, rowStart);
    const rowEndDate = new Date(viewYear, viewMonth, rowStart + 6);
    const rowBanners = EVENTS.filter(isSpanning)
      .map(ev => ({ ev, s: parseISO(ev.startDate), e: parseISO(ev.endDate) }))
      .filter(({ s, e }) => !(e < rowStartDate || s > rowEndDate));
    if (rowBanners.length > 1) row.classList.add('has-multi-banner');

    for (let c = 0; c < 7; c++) {
      const cellIndex = w * 7 + c;
      const dayNum = cellIndex - firstDow + 1;
      const cell = document.createElement('div');
      cell.className = 'day';

      let y = viewYear, m = viewMonth, d = dayNum, inMonth = true;
      if (dayNum < 1) {                       // previous month tail
        inMonth = false; d = prevDays + dayNum; m = viewMonth - 1;
        if (m < 0) { m = 11; y -= 1; }
      } else if (dayNum > daysInMonth) {      // next month head
        inMonth = false; d = dayNum - daysInMonth; m = viewMonth + 1;
        if (m > 11) { m = 0; y += 1; }
      }
      if (!inMonth) cell.classList.add('out');

      const key = iso(y, m, d);
      const isToday = y === TODAY.y && m === TODAY.m && d === TODAY.d;
      if (isToday) cell.classList.add('today');

      /* Header row: left slot (Today / Active!) + right-aligned big number */
      let leftLabel = '';
      if (isToday) leftLabel = '<span class="today-label">Today</span>';
      else if (ACTIVE_TAGS[key]) leftLabel = `<span class="active-tag">${ACTIVE_TAGS[key]}</span>`;
      cell.innerHTML = `<div class="day-head">${leftLabel || '<span></span>'}<span class="num">${d}</span></div>`;

      const dayEvents = eventsOn(y, m, d);
      const single = dayEvents.filter(e => !isSpanning(e));
      const spanning = dayEvents.filter(isSpanning);

      if (spanning.length) cell.classList.add('span-pad');
      if (rowBanners.length > 1 && spanning.length) cell.classList.add('span-pad2');

      const MAX = 4, shown = single.slice(0, MAX);
      for (const ev of shown) {
        const btn = document.createElement('button');
        btn.className = `ev ${chipClass(ev)}`;
        btn.dataset.event = ev.id;
        btn.innerHTML = `<span class="t">${chipTime(ev)}</span><span class="d">${ev.title}</span>`;
        btn.addEventListener('click', () => openModal(ev.id));
        cell.appendChild(btn);
      }
      if (single.length > MAX) {
        const more = document.createElement('div');
        more.className = 'more';
        more.textContent = `+${single.length - MAX} more`;
        cell.appendChild(more);
      }
      row.appendChild(cell);
    }

    /* Banner segments for this row (stacked upward if overlapping) */
    rowBanners.forEach(({ ev, s, e }, idx) => {
      const segStart = s > rowStartDate ? s : rowStartDate;
      const segEnd = e < rowEndDate ? e : rowEndDate;
      const colStart = Math.round((segStart - rowStartDate) / 86400000); // 0..6
      const colSpan = Math.round((segEnd - segStart) / 86400000) + 1;

      const banner = document.createElement('div');
      banner.className = `span-banner banner-${ev.banner || 'green'}` + (s >= rowStartDate ? ' edge-l' : '') + (e <= rowEndDate ? ' edge-r' : '');
      banner.style.left = `calc(${(colStart / 7) * 100}% + 5px)`;
      banner.style.width = `calc(${(colSpan / 7) * 100}% - 10px)`;
      banner.style.top = `calc(100% - 32px - ${idx * 26}px)`;
      banner.innerHTML = `<span class="t">${ev.timeLabel || ''}</span><span class="d">${ev.title}</span>`;
      banner.addEventListener('click', () => openModal(ev.id));
      row.appendChild(banner);
    });

    grid.appendChild(row);
  }
}

/* ── Event detail modal ─────────────────────────────────── */
const backdrop = $('#modalBackdrop');
const modal = { kind: $('#modalKind'), title: $('#modalTitle'), rows: $('#modalRows'), link: $('#modalLink') };
let currentEventId = null;

const KIND_LABEL = { class: 'Class session', exam: 'Exam', deadline: 'eLearning deadline', personal: 'Personal' };
const STATUS_VI = { scheduled: 'Học bình thường', absent: 'Báo vắng', makeup: 'Học bù', cancelled: 'Đã hủy', moved: 'Đã chuyển lịch' };

const row = (label, valueHtml) =>
  `<div class="row"><div class="lbl">${label}</div><div class="val">${valueHtml}</div></div>`;

function openModal(id) {
  const ev = EVENT_MAP[id];
  if (!ev) return;
  currentEventId = id;

  modal.kind.textContent = KIND_LABEL[ev.kind] || ev.kind;
  modal.kind.className = `kind ${ev.kind}`;
  modal.title.textContent = ev.title;

  const rows = [];
  if (ev.kind === 'class') {
    rows.push(row('Date', `${fmtLong(ev.date)} · ${weekdayName(ev.date)}`));
    rows.push(row('Time', `${ev.start} – ${ev.end || '—'} &nbsp;·&nbsp; Tiết ${ev.period || '—'}`));
    rows.push(row('Room', ev.location || '—'));
    rows.push(row('Status', STATUS_VI[ev.status] || ev.status));
    if (ev.notes) rows.push(row('Notes', ev.notes));
  } else if (ev.kind === 'exam') {
    rows.push(row('Date', fmtLong(ev.date)));
    rows.push(row('Time', ev.start ? ev.start + (ev.end ? ' – ' + ev.end : ' · thời lượng chưa rõ') : 'Cả ngày'));
    rows.push(row('Room', ev.location || '—'));
    rows.push(row('Type', ev.examType || '—'));
    if (ev.notes) rows.push(row('Notes', ev.notes));
  } else if (ev.kind === 'deadline') {
    rows.push(row('Due', `${fmtLong(ev.date)} · ${ev.start} (GMT+7)`));
    rows.push(row('Course', ev.course || '—'));
    rows.push(row('Status', 'Chưa hoàn thành'));
    if (ev.notes) rows.push(row('Notes', ev.notes));
  } else if (ev.kind === 'personal') {
    if (ev.allDay) {
      rows.push(row('When', `${fmtLong(ev.startDate)} → ${fmtLong(ev.endDate)}`));
      rows.push(row('Type', 'All-day · multi-day'));
    } else {
      rows.push(row('Date', `${fmtLong(ev.date)} · ${weekdayName(ev.date)}`));
      rows.push(row('Time', `${ev.start} – ${ev.end || '—'}`));
    }
  }
  modal.rows.innerHTML = rows.join('');

  const isDeadline = ev.kind === 'deadline' && ev.url;
  modal.link.style.display = isDeadline ? '' : 'none';
  if (isDeadline) modal.link.href = ev.url;

  backdrop.classList.add('open');
}
function closeModal() { backdrop.classList.remove('open'); currentEventId = null; }

const fmtLong = isoStr => parseISO(isoStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const weekdayName = isoStr => parseISO(isoStr).toLocaleDateString('en-US', { weekday: 'long' });

backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
$('#modalClose').addEventListener('click', closeModal);
$('#modalDelete').addEventListener('click', () => { alert('Prototype only — deletion will hit SQLite via FastAPI in the real app.'); });
$('#modalEdit').addEventListener('click', () => { alert('Prototype only — editing comes with the FastAPI backend (PATCH /api/events/:id).'); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Month navigation ───────────────────────────────────── */
function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
  if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
  render();
}
$('#prevMonth').addEventListener('click', () => shiftMonth(-1));
$('#nextMonth').addEventListener('click', () => shiftMonth(1));
$('#jumpToday').addEventListener('click', () => { viewYear = TODAY.y; viewMonth = TODAY.m; render(); });
$('#monthPicker').addEventListener('click', () => shiftMonth(1));

render();
</script>
